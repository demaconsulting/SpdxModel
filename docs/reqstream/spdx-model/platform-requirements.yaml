---
# SpdxModel platform requirements

sections:
  - title: SpdxModel Requirements
    sections:
      - title: Platform Support
        requirements:
          - id: SpdxModel-Platform-MacOS
            title: The library shall build and run on macOS platforms.
            tags:
              - system
              - platform
            justification: |
              DEMA Consulting libraries must support macOS for developers using Apple platforms.
            tests:
              # Tests link to "macos" to ensure results come from macOS platform
              - "macos@SpdxModel_ReadSpdxJson_Spdx22Example_ParsesSuccessfully"
              - "macos@SpdxModel_WriteReadSpdxJson_Spdx23Example_RoundTripSucceeds"

          - id: SpdxModel-Platform-Windows
            title: The library shall build and run on Windows platforms.
            tags:
              - system
              - platform
            justification: |
              DEMA Consulting libraries must support Windows as the primary development and
              deployment platform for enterprise .NET applications.
            tests:
              - "windows@SpdxModel_ReadSpdxJson_Spdx22Example_ParsesSuccessfully"
              - "windows@SpdxModel_WriteReadSpdxJson_Spdx23Example_RoundTripSucceeds"

          - id: SpdxModel-Platform-Linux
            title: The library shall build and run on Linux platforms.
            tags:
              - system
              - platform
            justification: |
              DEMA Consulting libraries must support Linux for CI/CD pipelines and server
              deployments in cloud-native environments.
            tests:
              - "ubuntu@SpdxModel_ReadSpdxJson_Spdx22Example_ParsesSuccessfully"
              - "ubuntu@SpdxModel_WriteReadSpdxJson_Spdx23Example_RoundTripSucceeds"

          - id: SpdxModel-Platform-Net8
            title: The library shall support .NET 8 runtime.
            tags:
              - system
              - platform
            justification: |
              .NET 8 is a Long-Term Support (LTS) release that reached end of support in November 2026.
              The library continues to support this runtime so that users who have not yet migrated to
              a newer release, such as enterprise environments with slow upgrade cycles, can keep
              using it.
            tests:
              - net8.0@SpdxModel_ReadSpdxJson_Spdx22Example_ParsesSuccessfully
              - net8.0@SpdxModel_WriteReadSpdxJson_Spdx23Example_RoundTripSucceeds

          - id: SpdxModel-Platform-Net9
            title: The library shall support .NET 9 runtime.
            tags:
              - system
              - platform
            justification: |
              .NET 9 is a Standard-Term Support (STS) release that has reached end of support. The
              library continues to support this runtime so that users who have not yet migrated to a
              newer release can keep using it.
            tests:
              - net9.0@SpdxModel_ReadSpdxJson_Spdx22Example_ParsesSuccessfully
              - net9.0@SpdxModel_WriteReadSpdxJson_Spdx23Example_RoundTripSucceeds

          - id: SpdxModel-Platform-Net10
            title: The library shall support .NET 10 runtime.
            tags:
              - system
              - platform
            justification: |
              .NET 10 is the current Long-Term Support (LTS) release. Supporting this runtime provides
              a stable, long-term supported target for users who prefer LTS releases.
            tests:
              - net10.0@SpdxModel_ReadSpdxJson_Spdx22Example_ParsesSuccessfully
              - net10.0@SpdxModel_WriteReadSpdxJson_Spdx23Example_RoundTripSucceeds

          - id: SpdxModel-Platform-Net11
            title: The library shall support .NET 11 runtime.
            tags:
              - system
              - platform
            justification: |
              .NET 11 is the latest release in the .NET platform roadmap. Supporting this runtime
              ensures the library works for users as they adopt the newest .NET version.
            tests:
              - net11.0@SpdxModel_ReadSpdxJson_Spdx22Example_ParsesSuccessfully
              - net11.0@SpdxModel_WriteReadSpdxJson_Spdx23Example_RoundTripSucceeds

          - id: SpdxModel-Platform-NetStd20
            title: The library shall support the .NET Standard 2.0 target framework.
            tags:
              - system
              - platform
            justification: |
              .NET Standard 2.0 is a widely-supported target framework that enables the library to
              be used in MSBuild extensions and other tooling that requires .NET Standard compatibility.
              Supporting this target framework ensures the library can be integrated into a broader
              range of .NET projects, including those targeting .NET Framework and older .NET Core versions.
              The net481 test target on Windows provides direct runtime evidence of .NET Standard 2.0
              compatibility, as .NET Framework 4.8.1 fully implements the .NET Standard 2.0 API surface.
            tests:
              - "net481@SpdxModel_ReadSpdxJson_Spdx22Example_ParsesSuccessfully"
              - "net481@SpdxModel_WriteReadSpdxJson_Spdx23Example_RoundTripSucceeds"
