---
# Spell-Checking with TextLint
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: "0.2"
language: en

# The files to spell-check
files:
  - "**/*.{md,yaml,yml,json,cs,cpp,hpp,h,txt}"
# Include hidden paths such as .github/ and .*.yaml
enableGlobDot: true

# Project-specific technical terms and tool names
words:
  - acknowledgement
  - acmecorp
  - acmenator
  - Alsos
  - Cyper
  - DEMA
  - demaconsulting
  - DEMACONSULTINGNUGETKEY
  - Doap
  - ncipollo
  - Neko
  - nestings
  - netstandard
  - NOASSERTION
  - Protecode
  - Sarif
  - Setext
  - snupkg
  - sonarscanner
  - SPDXID
  - SPDXJSON
  - subclassing
  - thirdparty
  - unidirectionality
  - venv
  - yamlfix

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/generated/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "**/bin/**"
  - "**/obj/**"
  - "*.nupkg"
  - "*.snupkg"
  - "*.dll"
  - "*.exe"
  - "*.trx"
  - "*.spdx.json"
  - package-lock.json
  - yarn.lock
